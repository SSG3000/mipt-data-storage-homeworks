services:
  postgres:
    image: postgres:17-alpine
    container_name: mfti-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mfti_store
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - mfti-postgres-data:/var/lib/postgresql/data
      - ./:/workspace:ro

volumes:
  mfti-postgres-data:
    external: true
